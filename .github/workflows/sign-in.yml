name: Daily Sign In

on:
  schedule:
    # 01:17 UTC / 09:17 Asia/Shanghai, every day.
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Must match every workflow consuming this rotating credential set.
concurrency:
  group: aliyunpan-monitor-credentials
  cancel-in-progress: false

jobs:
  sign-in:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: aliyunpan-monitor
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Test sign-in and persistence without real credentials
        run: cargo test --locked --example web_api_check sign_in

      - name: Build sign-in runner
        run: cargo build --locked --example web_api_check

      - name: Request daily sign-in and persist rotated credentials
        id: sign_in
        timeout-minutes: 5
        env:
          ALIYUNPAN_CREDENTIALS: ${{ secrets.ALIYUNPAN_CREDENTIALS }}
          GH_TOKEN: ${{ secrets.ALIYUNPAN_SECRET_WRITER }}
          GH_REPO: ${{ github.repository }}
        run: |
          target/debug/examples/web_api_check "$RUNNER_TEMP/aliyunpan-credentials.json" --sign-in

      - name: Retry checkpoint persistence after failure
        if: ${{ always() && (steps.sign_in.outcome == 'failure' || steps.sign_in.outcome == 'cancelled') }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.ALIYUNPAN_SECRET_WRITER }}
          GH_REPO: ${{ github.repository }}
        run: |
          if test -f "$RUNNER_TEMP/aliyunpan-credentials.json"; then
            target/debug/examples/web_api_check "$RUNNER_TEMP/aliyunpan-credentials.json" --persist-only
          else
            echo "::error::No credential checkpoint exists; inspect the sign-in failure."
            exit 1
          fi

      - name: Remove credential checkpoint
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/aliyunpan-credentials.json"
