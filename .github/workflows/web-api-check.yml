name: Web API Contract Tests

on:
  schedule:
    # 03:17 UTC / 11:17 Asia/Shanghai, every day.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# All runs using these rotating credentials must use this same group.
concurrency:
  group: aliyunpan-monitor-credentials
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: aliyunpan-monitor
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Test API monitor without credentials
        run: cargo test --locked --example web_api_check

      - name: Build API test runner
        run: cargo build --locked --example web_api_check

      - name: Generate synthetic image and video fixtures
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y ffmpeg
          mkdir -p "$RUNNER_TEMP/aliyunpan-api-tests"
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=blue:s=128x128" \
            -frames:v 1 -threads 1 "$RUNNER_TEMP/aliyunpan-api-tests/fixture.jpg"
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=blue:s=128x128:r=10" \
            -t 2 -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            "$RUNNER_TEMP/aliyunpan-api-tests/fixture.mp4"

      - name: Test isolated read/write APIs and persist every token rotation
        id: probe
        timeout-minutes: 25
        env:
          ALIYUNPAN_CREDENTIALS: ${{ secrets.ALIYUNPAN_CREDENTIALS }}
          GH_TOKEN: ${{ secrets.ALIYUNPAN_SECRET_WRITER }}
          GH_REPO: ${{ github.repository }}
        run: |
          target/debug/examples/web_api_check "$RUNNER_TEMP/aliyunpan-credentials.json" \
            --full "$RUNNER_TEMP/aliyunpan-api-tests"

      - name: Retry checkpoint persistence after failure
        if: ${{ always() && (steps.probe.outcome == 'failure' || steps.probe.outcome == 'cancelled') }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.ALIYUNPAN_SECRET_WRITER }}
          GH_REPO: ${{ github.repository }}
        run: |
          if test -f "$RUNNER_TEMP/aliyunpan-credentials.json"; then
            target/debug/examples/web_api_check "$RUNNER_TEMP/aliyunpan-credentials.json" --persist-only
          else
            echo "::error::No credential checkpoint exists; inspect the failed probe step."
            exit 1
          fi

      - name: Publish per-API test summary
        if: ${{ always() && steps.probe.outcome != 'skipped' }}
        run: |
          if test -f "$RUNNER_TEMP/aliyunpan-api-tests/api-report.md"; then
            cat "$RUNNER_TEMP/aliyunpan-api-tests/api-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "API report unavailable: fixture generation, credentials, or runner initialization failed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload redacted API report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-api-report
          path: |
            ${{ runner.temp }}/aliyunpan-api-tests/api-report.json
            ${{ runner.temp }}/aliyunpan-api-tests/api-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Remove credential checkpoint
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/aliyunpan-credentials.json"
