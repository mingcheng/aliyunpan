name: Release Crates

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Perform a dry run without actually publishing"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: crates-publish
  cancel-in-progress: false

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify release tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" != refs/tags/* ]]; then
            echo "Select a version tag to run this workflow."
            exit 1
          fi
          version="$(cargo metadata --no-deps --format-version | jq -r '.packages[] | select(.name == "aliyunpan") | .version')"
          test "$RELEASE_TAG" = "v$version"

      - name: Install native TLS dependencies
        run: sudo -n apt-get update && sudo -n apt-get install -y pkg-config libssl-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --lib --test mock

      - name: Test documentation
        run: cargo test --locked --doc

      - name: Verify package can be built
        run: cargo package --locked

      - name: Publish to crates.io (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: cargo publish --dry-run --locked

      - name: Publish to crates.io
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
