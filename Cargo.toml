[package]
name = "aliyunpan"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
description = "Unofficial async Rust SDK for the Aliyun Drive (alipan.com) web API"
license = "MIT"
readme = "README.md"
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]
keywords = ["aliyunpan", "alipan", "aliyundrive", "cloud-storage", "sdk"]
categories = ["api-bindings", "asynchronous"]
authors = ["mingcheng <mingcheng@apache.org>"]
repository = "https://github.com/mingcheng/aliyunpan"
homepage = "https://github.com/mingcheng/aliyunpan"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
bytes = "1"
getrandom = "0.4"
k256 = { version = "0.14", default-features = false, features = [
    "ecdsa",
    "std",
] }
md-5 = "0.11"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
